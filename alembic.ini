# Alembic config — production migrations for the master tracking DB.
# Dev/test bootstraps the schema with create_all (algops.tracking.init_engine). In production:
#   ALGOPS_MASTER_DB_URL=postgresql+psycopg://... uv run alembic upgrade head
# After changing algops/tracking/models.py:
#   uv run alembic revision --autogenerate -m "<change>"   (tests/test_migrations.py keeps them in sync)
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# DB URL is read from ALGOPS_MASTER_DB_URL via env.py (do not hardcode here).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
