name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Configure git identity (tests create throwaway repos)
        run: |
          git config --global user.name "algops-ci"
          git config --global user.email "ci@algops.local"
          git config --global init.defaultBranch main
      - name: Tests
        run: uv run pytest -q
      - name: Example repos pass their own gates (algops test)
        run: |
          uv run algops test examples/py-multi-algo
          uv run algops test examples/c-threshold

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build   # typecheck + build into src/algops/master/static/ui
      - name: Committed UI build is up to date
        working-directory: .
        run: git diff --exit-code --stat -- src/algops/master/static/ui || (echo "::error::run 'cd frontend && npm run build' and commit src/algops/master/static/ui" && exit 1)
