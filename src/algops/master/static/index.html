<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALGOps — 알고리즘 파라미터 최적화</title>
<style>
  :root{--bg:#0e1116;--panel:#171c24;--panel2:#1e2530;--line:#2a323f;--fg:#e6edf3;--mut:#8b97a7;--acc:#4f9cf9;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  header h1{font-size:16px;margin:0;font-weight:650}
  header .sub{color:var(--mut);font-size:12px}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 53px)}
  .col{overflow:auto;padding:16px}
  .col.left{border-right:1px solid var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:8px}
  button{background:var(--acc);color:#06121f;border:0;border-radius:7px;padding:8px 14px;font-weight:650;cursor:pointer}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center}
  .list .item{padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer;background:var(--panel2)}
  .list .item:hover{border-color:var(--acc)}
  .list .item.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
  .pill.on{color:var(--ok);border-color:var(--ok)}
  .pill.run{color:var(--acc);border-color:var(--acc)}
  .pill.done{color:var(--ok);border-color:var(--ok)}
  .pill.fail{color:var(--bad);border-color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  .muted{color:var(--mut)}
  .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
  .bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--acc)}
  .empty{color:var(--mut);text-align:center;padding:30px 0}
  code{background:var(--panel2);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<header>
  <h1>⚙️ ALGOps</h1>
  <span class="sub">알고리즘 파라미터 최적화 · M0</span>
  <span style="flex:1"></span>
  <span class="sub" id="health">●</span>
</header>
<div class="wrap">
  <div class="col left">
    <div class="card">
      <h2>프로젝트</h2>
      <div class="list" id="projects"><div class="empty">로딩…</div></div>
      <div class="row" style="margin-top:8px">
        <input id="newProjName" placeholder="새 프로젝트 이름" />
        <button class="ghost" onclick="createProject()">+ 추가</button>
      </div>
      <p class="muted" style="font-size:12px;margin:10px 0 0">Slave가 등록하면 프로젝트가 자동 생성됩니다. 직접 추가도 가능합니다.</p>
    </div>
    <div class="card" id="expCard" style="display:none">
      <h2>실험 — <span id="expProjName"></span></h2>
      <div class="list" id="experiments"></div>
      <div style="margin-top:10px">
        <label>목표 (자연어)</label>
        <input id="goalText" value="오탐 완화" />
        <div class="row">
          <div style="flex:1"><label>목표 지표</label>
            <select id="targetMetric">
              <option value="fp_rate">fp_rate (오탐율↓)</option>
              <option value="fn_rate">fn_rate (미탐율↓)</option>
              <option value="precision">precision↑</option>
              <option value="recall">recall↑</option>
              <option value="f1">f1↑</option>
            </select>
          </div>
          <div style="width:90px"><label>목표값</label><input id="targetValue" value="0.05" /></div>
          <div style="width:80px"><label>max iter</label><input id="maxIter" value="10" /></div>
        </div>
        <button style="margin-top:10px;width:100%" onclick="createExperiment()">실험 생성</button>
      </div>
    </div>
  </div>
  <div class="col right" id="detail"><div class="empty">프로젝트와 실험을 선택하세요.</div></div>
</div>
<script>
const $ = s => document.querySelector(s);
let state = {project:null, experiment:null, ws:null, rows:{}};

async function api(path, opts){ const r = await fetch(path, opts); if(!r.ok) throw new Error((await r.text())||r.status); return r.status===204?null:r.json(); }
function metricCells(m){ return m ? `<td>${m.precision.toFixed(3)}</td><td>${m.recall.toFixed(3)}</td><td>${m.f1.toFixed(3)}</td><td>${m.fp_rate.toFixed(3)}</td><td>${m.fn_rate.toFixed(3)}</td>` : '<td>–</td><td>–</td><td>–</td><td>–</td><td>–</td>'; }

async function health(){ try{ await api('/healthz'); $('#health').style.color='var(--ok)'; }catch{ $('#health').style.color='var(--bad)'; } }

async function loadProjects(){
  const ps = await api('/api/v1/projects');
  const el = $('#projects');
  if(!ps.length){ el.innerHTML='<div class="empty">아직 프로젝트가 없습니다.</div>'; return; }
  el.innerHTML = ps.map(p=>`<div class="item ${state.project&&state.project.project_id===p.project_id?'sel':''}" onclick="selectProject('${p.project_id}')">
    <div class="row" style="justify-content:space-between"><b>${p.name}</b>
    <span class="pill ${p.slave_online?'on':''}">${p.slave_online?'● online':'○ offline'}</span></div>
    <div class="muted" style="font-size:12px">${p.modality}</div></div>`).join('');
}
async function createProject(){
  const name = $('#newProjName').value.trim(); if(!name) return;
  const p = await api('/api/v1/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});
  $('#newProjName').value=''; await loadProjects(); selectProject(p.project_id);
}
async function selectProject(pid){
  const ps = await api('/api/v1/projects'); state.project = ps.find(p=>p.project_id===pid);
  $('#expCard').style.display='block'; $('#expProjName').textContent = state.project.name;
  await loadProjects(); await loadExperiments();
}
async function loadExperiments(){
  const xs = await api('/api/v1/experiments?project_id='+state.project.project_id);
  const el = $('#experiments');
  el.innerHTML = xs.length ? xs.map(x=>`<div class="item ${state.experiment&&state.experiment.experiment_id===x.experiment_id?'sel':''}" onclick="openExperiment('${x.experiment_id}')">
    <div class="row" style="justify-content:space-between"><span>${x.name||'experiment'}</span><span class="pill ${statusClass(x.status)}">${x.status}</span></div>
    <div class="muted" style="font-size:12px">${x.goal_text} · ${x.target_metric} ${dir(x.goal_direction)} ${x.target_value}</div></div>`).join('')
    : '<div class="empty" style="padding:12px">실험이 없습니다. 아래에서 생성하세요.</div>';
}
function statusClass(s){ if(s==='running')return 'run'; if(s==='failed')return 'fail'; if(s&&s.startsWith('stopped')||s==='target_reached')return 'done'; return ''; }
function dir(d){ return d==='minimize'?'≤':'≥'; }

async function createExperiment(){
  const body = {project_id:state.project.project_id, name:'실험-'+(new Date().toLocaleTimeString('ko-KR')),
    goal_text:$('#goalText').value, target_metric:$('#targetMetric').value,
    target_value:parseFloat($('#targetValue').value), max_iteration:parseInt($('#maxIter').value)};
  const x = await api('/api/v1/experiments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  await loadExperiments(); openExperiment(x.experiment_id);
}

async function openExperiment(eid){
  const x = await api('/api/v1/experiments/'+eid); state.experiment = x; state.rows={};
  await loadExperiments(); renderDetail(); connectWs(eid); await refreshRuns();
}
function renderDetail(){
  const x = state.experiment;
  $('#detail').innerHTML = `
    <div class="card"><div class="row" style="justify-content:space-between">
      <div><div class="muted">실험</div><div style="font-size:18px;font-weight:650">${x.name}</div>
        <div class="muted" style="font-size:12px">목표: ${x.goal_text} · <code>${x.target_metric}</code> ${dir(x.goal_direction)} ${x.target_value} · 최대 ${x.max_iteration} iter</div></div>
      <div class="row"><span class="pill ${statusClass(x.status)}" id="expStatus">${x.status}</span>
        <button id="runBtn" onclick="runExperiment()" ${x.status==='running'?'disabled':''}>▶ 실행</button></div>
    </div></div>
    <div class="card"><h2>진행 (반복)</h2>
      <table><thead><tr><th>iter</th><th>threshold</th><th>precision</th><th>recall</th><th>f1</th><th>fp_rate</th><th>fn_rate</th><th>판정</th></tr></thead>
      <tbody id="iterBody"><tr><td colspan="8" class="empty">실행하면 여기에 반복이 표시됩니다.</td></tr></tbody></table></div>
    <div class="card" id="finalCard" style="display:none"></div>`;
}
async function refreshRuns(){
  if(!state.experiment) return;
  const runs = await api('/api/v1/experiments/'+state.experiment.experiment_id+'/runs');
  runs.forEach(r=>{ state.rows[r.iteration_index]={iter:r.iteration_index, params:r.param_values, metrics:r.metrics}; });
  renderRows();
  if(['target_reached','stopped_max_iter','stopped_by_pm'].includes(state.experiment.status)) loadFinal();
}
function renderRows(){
  const body = $('#iterBody'); if(!body) return;
  const keys = Object.keys(state.rows).map(Number).sort((a,b)=>a-b);
  if(!keys.length){ return; }
  const pk = 'detector.confidence_threshold';
  body.innerHTML = keys.map(k=>{ const r=state.rows[k]; const th=r.params&&r.params[pk]!=null?(+r.params[pk]).toFixed(3):'–';
    const dec = r.decision? `<span class="pill ${r.decision==='stop'?'done':''}">${r.decision}</span>`:'';
    return `<tr><td>${r.iter}</td><td>${th}</td>${metricCells(r.metrics)}<td>${dec}</td></tr>`; }).join('');
}
async function runExperiment(){
  const eid = state.experiment.experiment_id;
  $('#runBtn').disabled=true; setStatus('running');
  await api('/api/v1/experiments/'+eid+'/run',{method:'POST'});
}
function setStatus(s){ state.experiment.status=s; const el=$('#expStatus'); if(el){el.textContent=s; el.className='pill '+statusClass(s);} }
function connectWs(eid){
  if(state.ws){ try{state.ws.close()}catch{} }
  const proto = location.protocol==='https:'?'wss':'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/experiments/${eid}`); state.ws=ws;
  ws.onmessage = ev=>{ const m=JSON.parse(ev.data); handleEvent(m); };
}
function handleEvent(m){
  if(m.type==='run_evaluated'){
    state.rows[m.iteration]={iter:m.iteration, params:m.params, metrics:m.metrics}; renderRows();
  } else if(m.type==='iteration_decided'){
    if(state.rows[m.iteration]) state.rows[m.iteration].decision=m.pm_action; renderRows();
  } else if(m.type==='experiment_done'){
    setStatus(m.status); $('#runBtn').disabled=false; loadFinal(); loadProjects();
  } else if(m.type==='experiment_failed'){
    setStatus('failed'); $('#runBtn').disabled=false;
    $('#finalCard').style.display='block'; $('#finalCard').innerHTML=`<h2>실패</h2><div style="color:var(--bad)">${m.error}</div>`;
  } else if(m.type==='experiment_started'){ setStatus('running'); }
}
async function loadFinal(){
  try{
    const f = await api('/api/v1/experiments/'+state.experiment.experiment_id+'/final');
    const m=f.metrics; const pk='detector.confidence_threshold';
    $('#finalCard').style.display='block';
    $('#finalCard').innerHTML = `<h2>최종 결과</h2>
      <div class="row" style="gap:24px;align-items:flex-end">
        <div><div class="muted">종료 사유</div><div class="big" style="font-size:18px">${f.stop_reason||'-'}</div></div>
        <div><div class="muted">최적 ${state.experiment.target_metric}</div><div class="big">${m?m[state.experiment.target_metric].toFixed(3):'-'}</div></div>
        <div style="flex:1"><div class="muted">최적 파라미터</div>
          ${Object.entries(f.optimal_params).map(([k,v])=>`<div class="kv"><code>${k}</code><b>${(+v).toFixed?(+v).toFixed(3):v}</b></div>`).join('')}</div>
      </div>
      ${m?`<table style="margin-top:12px"><thead><tr><th>precision</th><th>recall</th><th>f1</th><th>fp_rate</th><th>fn_rate</th></tr></thead>
      <tbody><tr><td>${m.precision.toFixed(3)}</td><td>${m.recall.toFixed(3)}</td><td>${m.f1.toFixed(3)}</td><td>${m.fp_rate.toFixed(3)}</td><td>${m.fn_rate.toFixed(3)}</td></tr></tbody></table>`:''}
      <div class="muted" style="font-size:12px;margin-top:8px">알림 발송: ${f.notified?'완료':'미발송'} · 우승 run <code>${(f.winning_run_id||'').slice(0,8)}</code></div>`;
  }catch{}
}
health(); loadProjects(); setInterval(health, 8000); setInterval(loadProjects, 6000);
</script>
</body>
</html>
