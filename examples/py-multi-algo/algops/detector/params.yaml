# detector post-processing parameters (contract v2 — see AGENTS.md)
meta:
  algops_contract_version: "2.0"
  param_spec_version: 1
  modality: image
params:
  - key: detector.score_threshold
    dtype: float
    default: 0.5            # keep a detection when score >= threshold
    range: [0.05, 0.95]
    step: 0.05
    stage: decision
    influence: { fp: high, fn: high }
    drop_reasons: [low_score]
    description: Minimum detector score to keep a candidate.
  - key: detector.min_area
    dtype: int
    default: 0              # pixels; 0 disables the area filter
    range: [0, 300]
    step: 20
    stage: postproc_shape
    influence: { fp: medium, fn: medium }
    drop_reasons: [small_area]
    description: Minimum box area to keep a candidate.
  - key: detector.area_rule
    dtype: enum
    default: strict
    enum: [strict, rescue_confident]
    stage: postproc_shape
    influence: { fp: low, fn: medium }
    description: "rescue_confident keeps small boxes whose score >= 0.85."
